<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Reset your Sir.G Tutors password.">
  <title>Reset Password | Sir.G Tutors</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <div class="page-loader" aria-hidden="true">
    <span class="loader-brand"><span class="brand-main">Sir.G</span><span class="brand-accent">Tutors</span></span>
  </div>

  <header class="site-header">
    <div class="container navbar">
      <a class="brand" href="index.html" aria-label="Sir.G Tutors home page"><span class="brand-main">Sir.G</span><span class="brand-accent">Tutors</span></a>
    </div>
  </header>

  <main>
    <div class="auth-layout" data-animate="fade-up">
      <section class="auth-panel" aria-label="Reset password">
        <span class="auth-shape-one" aria-hidden="true"></span>
        <span class="auth-shape-two" aria-hidden="true"></span>
        <div class="auth-panel-content">
          <h1>Reset your password</h1>
          <ul class="auth-benefits">
            <li>Choose a strong new password</li>
            <li>Protect your learning account</li>
          </ul>
        </div>
      </section>

      <section class="auth-form-side" aria-labelledby="reset-title">
        <div class="auth-form-wrap">
          <h2 id="reset-title">Create a new password</h2>
          <form class="auth-form" id="reset-password-form" novalidate>
            <div class="floating-field">
              <input id="reset-password" name="password" type="password" placeholder=" " autocomplete="new-password" required>
              <label for="reset-password">New password</label>
              <button class="password-toggle" type="button" aria-label="Show password" aria-controls="reset-password">Show</button>
              <p class="field-error" id="reset-password-error" aria-live="polite"></p>
            </div>
            <div class="floating-field">
              <input id="reset-confirm-password" name="confirmPassword" type="password" placeholder=" " autocomplete="new-password" required>
              <label for="reset-confirm-password">Confirm new password</label>
              <button class="password-toggle" type="button" aria-label="Show confirm password" aria-controls="reset-confirm-password">Show</button>
              <p class="field-error" id="reset-confirm-password-error" aria-live="polite"></p>
            </div>
            <button class="btn auth-submit" type="submit">Update Password</button>
            <p class="auth-success" role="status"></p>
            <p class="auth-switch"><a href="login.html">Back to login</a></p>
          </form>
        </div>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="js/supabaseClient.js" defer></script>
  <script src="js/animations.js" defer></script>
  <script src="js/auth.js" defer></script>
</body>
</html>
